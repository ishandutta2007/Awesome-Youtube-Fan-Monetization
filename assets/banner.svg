<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" style="background:#0a0c16; border-radius:16px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#121124" />
      <stop offset="100%" stop-color="#0a0c16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="40%" stop-color="#FF6B6B" />
      <stop offset="70%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e38" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2a2550" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animation Keyframes -->
    <style>
      @keyframes pulseOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        50% { transform: translate(60px, 40px) scale(1.15); opacity: 0.55; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      }
      @keyframes pulseOrb2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        50% { transform: translate(-50px, -30px) scale(1.2); opacity: 0.5; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      }
      @keyframes floatCard1 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes floatCard2 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(12px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseRing {
        0% { r: 52px; opacity: 0.8; stroke-width: 2px; }
        50% { r: 64px; opacity: 0.2; stroke-width: 1px; }
        100% { r: 52px; opacity: 0.8; stroke-width: 2px; }
      }
      @keyframes shimmerLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .orb-red {
        animation: pulseOrb1 8s ease-in-out infinite;
      }
      .orb-purple {
        animation: pulseOrb2 10s ease-in-out infinite;
      }
      .float-1 {
        animation: floatCard1 5s ease-in-out infinite;
      }
      .float-2 {
        animation: floatCard2 6s ease-in-out infinite;
      }
      .pulse-ring {
        animation: pulseRing 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Ambient Light Orbs (Behind All Content) -->
  <g>
    <circle class="orb-red" cx="240" cy="120" r="140" fill="#FF0044" filter="url(#glowOrb)" />
    <circle class="orb-purple" cx="960" cy="300" r="160" fill="#7928CA" filter="url(#glowOrb)" />
    <circle class="orb-red" cx="1020" cy="80" r="100" fill="#6366F1" filter="url(#glowOrb)" opacity="0.3" />
  </g>

  <!-- Decorative Corner Elements -->
  <g opacity="0.4">
    <path d="M 30,50 L 30,30 L 50,30" stroke="#FF4D6D" stroke-width="2" fill="none" />
    <path d="M 1170,50 L 1170,30 L 1150,30" stroke="#8B5CF6" stroke-width="2" fill="none" />
    <path d="M 30,370 L 30,390 L 50,390" stroke="#8B5CF6" stroke-width="2" fill="none" />
    <path d="M 1170,370 L 1170,390 L 1150,390" stroke="#FF4D6D" stroke-width="2" fill="none" />
  </g>

  <!-- Side Floating Feature Chips (Non-obstructing, positioned at safe margins) -->
  <g class="float-1" opacity="0.88">
    <!-- Left Pill: Memberships -->
    <g transform="translate(60, 110)">
      <rect width="160" height="42" rx="21" fill="url(#pillGrad)" stroke="#FF3366" stroke-width="1.2" />
      <circle cx="24" cy="21" r="8" fill="#FF3366" />
      <text x="42" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">👑 Memberships</text>
    </g>
    <!-- Left Pill: Digital Products -->
    <g transform="translate(45, 230)">
      <rect width="180" height="42" rx="21" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="1.2" />
      <circle cx="24" cy="21" r="8" fill="#8B5CF6" />
      <text x="42" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">📦 Digital Products</text>
    </g>
  </g>

  <g class="float-2" opacity="0.88">
    <!-- Right Pill: Fan Tipping -->
    <g transform="translate(980, 110)">
      <rect width="165" height="42" rx="21" fill="url(#pillGrad)" stroke="#10B981" stroke-width="1.2" />
      <circle cx="24" cy="21" r="8" fill="#10B981" />
      <text x="42" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">☕ Fan Tipping</text>
    </g>
    <!-- Right Pill: 100% Self-Hosted -->
    <g transform="translate(970, 230)">
      <rect width="180" height="42" rx="21" fill="url(#pillGrad)" stroke="#F59E0B" stroke-width="1.2" />
      <circle cx="24" cy="21" r="8" fill="#F59E0B" />
      <text x="42" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🔓 100% Self-Hosted</text>
    </g>
  </g>

  <!-- Central YouTube / Monetization Pulse Icon (Above Background, Below Text) -->
  <g transform="translate(600, 78)">
    <circle class="pulse-ring" cx="0" cy="0" r="52" fill="none" stroke="#FF0033" />
    <circle cx="0" cy="0" r="44" fill="url(#accentGrad)" filter="url(#softGlow)" />
    <!-- Play Triangle with Coin Sparkle -->
    <polygon points="-10,-14 16,0 -10,14" fill="#FFFFFF" />
  </g>

  <!-- FOREGROUND: Main Title and Headings (Unobstructed & High Contrast) -->
  <g text-anchor="middle">
    <!-- Primary Title -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome YouTube Fan Monetization
    </text>

    <!-- Subtitle -->
    <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#E2E8F0" letter-spacing="0.2">
      Curated SaaS Platforms &amp; Open-Source Projects for Creator Subscriptions, Tipping &amp; Digital Storefronts
    </text>

    <!-- Tagline Metrics / Pillars Bar -->
    <g transform="translate(300, 280)">
      <rect x="0" y="0" width="600" height="42" rx="12" fill="#14172a" fill-opacity="0.85" stroke="#2e3558" stroke-width="1" />
      <text x="300" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
        <tspan fill="#FF4D6D">★ Creator Subscriptions</tspan>
        <tspan fill="#475569">  •  </tspan>
        <tspan fill="#A78BFA">🛒 E-Commerce &amp; Merch</tspan>
        <tspan fill="#475569">  •  </tspan>
        <tspan fill="#34D399">⚡ Zero Platform Fees</tspan>
      </text>
    </g>

    <!-- Bottom Metadata Status -->
    <text x="600" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B" letter-spacing="1">
      COMMUNITY-CURATED ECOSYSTEM FOR YOUTUBE CREATORS &amp; DEVELOPERS
    </text>
  </g>
</svg>
